<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 极光之夜 · from 拍立得软木板 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.6" stop-color="#04121f"/>
      <stop offset="1" stop-color="#071b26"/>
    </linearGradient>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.2" stop-color="#50f0b4" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#50f0b4" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#78b4ff" stop-opacity="0.5"/>
      <stop offset="0.72" stop-color="#78b4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0.3" stop-color="#b478ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b478ff" stop-opacity="0.4"/>
      <stop offset="0.66" stop-color="#b478ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g filter="url(#blur1)" transform="rotate(-8 800 300)">
    <rect x="-200" y="-100" width="2000" height="500" fill="url(#a1)"/>
  </g>
  <g filter="url(#blur2)" transform="rotate(6 800 300)">
    <rect x="-200" y="-50" width="2000" height="450" fill="url(#a2)"/>
  </g>
  <g fill="#ffffff">
    <circle cx="120" cy="120" r="2"/><circle cx="260" cy="80" r="1.6"/><circle cx="380" cy="200" r="2.2"/>
    <circle cx="520" cy="60" r="1.4"/><circle cx="700" cy="150" r="2"/><circle cx="900" cy="90" r="1.6"/>
    <circle cx="1050" cy="220" r="2.2"/><circle cx="1220" cy="70" r="1.6"/><circle cx="1380" cy="160" r="2"/>
    <circle cx="1500" cy="100" r="1.4"/><circle cx="200" cy="300" r="1.8"/><circle cx="650" cy="280" r="1.4"/>
    <circle cx="1150" cy="320" r="1.8"/><circle cx="1450" cy="260" r="1.5"/>
  </g>
</svg>
