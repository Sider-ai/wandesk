<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 软木板 · 还原自 拍立得软木板 的 cork 背景 -->
  <defs>
    <linearGradient id="cork" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c79a5a"/>
      <stop offset="0.55" stop-color="#b9873f"/>
      <stop offset="1" stop-color="#a97730"/>
    </linearGradient>
    <radialGradient id="topglow" cx="30%" cy="12%" r="120%">
      <stop offset="0" stop-color="#fff0d2" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#fff0d2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="115%">
      <stop offset="0.52" stop-color="#462c10" stop-opacity="0"/>
      <stop offset="1" stop-color="#462c10" stop-opacity="0.4"/>
    </radialGradient>
    <!-- cork grain: fine multiply noise -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.27  0 0 0 0 0.10  0 0 0 0.85 0"/>
    </filter>
    <!-- lighter flecks: coarse screen noise -->
    <filter id="spec" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.05 0.06" numOctaves="2" seed="19" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.95  0 0 0 0 0.82  0 0 0 0 0.5  0 0 0 0.4 0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#cork)"/>
  <rect width="1600" height="1000" fill="url(#topglow)"/>
  <rect width="1600" height="1000" filter="url(#grain)" style="mix-blend-mode:multiply" opacity="0.9"/>
  <rect width="1600" height="1000" filter="url(#spec)" style="mix-blend-mode:screen" opacity="0.5"/>
  <rect width="1600" height="1000" fill="url(#vig)"/>
</svg>
