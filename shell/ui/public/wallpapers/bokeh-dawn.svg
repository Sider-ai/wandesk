<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Bokeh Morning: teal-to-warm-white bokeh circles, a soft-focus wash of morning light -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6b8a"/>
      <stop offset="0.55" stop-color="#3f9fb0"/>
      <stop offset="1" stop-color="#9fd8d2"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.82" cy="0.78" r="0.7">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.96" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#warm)"/>

  <!-- Background: large bokeh circles (more blurred) -->
  <g filter="url(#blur2)" opacity="0.8">
    <circle cx="240" cy="240" r="150" fill="url(#dot)"/>
    <circle cx="1330" cy="220" r="190" fill="url(#dot)"/>
    <circle cx="1120" cy="720" r="230" fill="url(#dot)"/>
  </g>
  <!-- Midground -->
  <g filter="url(#blur1)" opacity="0.85">
    <circle cx="640" cy="430" r="96" fill="url(#dot)"/>
    <circle cx="180" cy="580" r="84" fill="url(#dot)"/>
    <circle cx="1440" cy="520" r="90" fill="url(#dot)"/>
  </g>
</svg>
