<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="about.css" />
    <title>Wandesk</title>
    <script type="module" src="/about.js" defer></script>
  </head>
  <body>
    <main class="shell-page about-page">
      <header class="about-header">
        <div class="about-brand" id="shell-brand">Wandesk</div>
        <div class="about-version" id="about-version"></div>
      </header>
      <section class="about-links">
        <a class="about-link" id="website-link" href="#">
          <span class="about-link-label" id="website-label"></span>
          <span class="about-link-url" id="website-url"></span>
        </a>
        <a class="about-link" id="community-link" href="#">
          <span class="about-link-label" id="community-label"></span>
          <span class="about-link-url" id="community-url"></span>
        </a>
      </section>
      <section class="about-danger">
        <div class="about-danger-copy">
          <div class="about-danger-title" id="reset-title"></div>
          <div class="about-danger-desc" id="reset-desc"></div>
          <div class="about-danger-status" id="reset-status"></div>
        </div>
        <button class="about-reset-button" id="reset-button" type="button"></button>
      </section>
      <footer class="about-footer">
        <div class="about-tagline" id="about-tagline"></div>
        <a class="about-more" id="about-more" href="#">
          <span id="about-more-label"></span>
          <span class="about-more-arrow">↗</span>
        </a>
      </footer>
    </main>
  </body>
</html>
