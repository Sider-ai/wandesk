<!doctype html>
<meta charset="utf-8" />
<title>文件</title>
<link rel="stylesheet" href="/style.css" />
<script src="/_wd/sdk.js"></script>

<div class="fm">
  <div class="crumbs" id="crumbs"></div>
  <div class="cols">
    <ul class="list" id="list"></ul>
    <div class="view" id="view"><p class="empty">选一个文本文件看看</p></div>
  </div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
let cwd = "";

const api = (p) => fetch(p).then((r) => r.json());

async function load(path = "") {
  cwd = path;
  const { entries, error } = await api("/api/list?path=" + encodeURIComponent(path));
  if (error) return window.wandesk.ui.toast(error);
  const parts = path ? path.split("/") : [];
  $("crumbs").innerHTML =
    `<a data-p="">工作区</a>` +
    parts.map((seg, i) => ` / <a data-p="${parts.slice(0, i + 1).join("/")}">${seg}</a>`).join("");
  $("list").innerHTML = (entries || [])
    .sort((a, b) => (b.dir - a.dir) || a.name.localeCompare(b.name))
    .map((e) => `<li data-p="${e.path}" data-d="${e.dir ? 1 : 0}">
        <span class="ic">${e.dir ? "📁" : "📄"}</span>
        <span class="nm">${e.name.replace(/</g, "&lt;")}</span>
        <span class="sz">${e.dir ? "" : (e.size / 1024).toFixed(1) + "K"}</span>
      </li>`).join("");
  window.wandesk?.ui.title(path ? `文件 — ${path}` : "文件");
}

$("crumbs").addEventListener("click", (e) => {
  const a = e.target.closest("a[data-p]");
  if (a) load(a.dataset.p);
});

$("list").addEventListener("click", async (e) => {
  const li = e.target.closest("li[data-p]");
  if (!li) return;
  if (li.dataset.d === "1") return load(li.dataset.p);
  const { content, error } = await api("/api/read?path=" + encodeURIComponent(li.dataset.p));
  $("view").innerHTML = error ? `<p class="empty">${error}</p>` : "";
  if (!error) {
    const pre = document.createElement("pre");
    pre.textContent = content;
    $("view").append(pre);
  }
});

load();
</script>
