<!doctype html>
<meta charset="utf-8" />
<title>助理</title>
<link rel="stylesheet" href="/style.css" />
<script src="/_wd/sdk.js"></script>

<div class="chat">
  <div class="stream" id="stream"></div>
  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="说点什么…(⌘↩ 发送)"></textarea>
    <button type="submit" id="send">发送</button>
    <button type="button" id="clear" title="清空">🗑</button>
  </form>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const stream = $("stream");

const el = (cls, text) => {
  const d = document.createElement("div");
  d.className = cls;
  if (text !== undefined) d.textContent = text;
  return d;
};
const bottom = () => { stream.scrollTop = stream.scrollHeight; };

async function history() {
  const { turns } = await fetch("/api/history").then((r) => r.json());
  stream.innerHTML = "";
  for (const t of turns || []) stream.append(el("turn " + t.role, t.text));
  bottom();
}

// SSE 解析:事件名沿用内核契约 —— message / reasoning / function_call / done / error
async function send(text) {
  stream.append(el("turn user", text));
  const work = el("work");
  const steps = el("steps");
  const label = el("label", "思考中…");
  work.append(label, steps);
  stream.append(work);
  const answer = el("turn assistant");
  bottom();

  const res = await fetch("/api/send", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ text }),
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "", final = "", started = Date.now();

  const handle = (event, data) => {
    if (event === "function_call") {
      const args = (() => { try { return JSON.parse(data.item?.arguments || "{}"); } catch { return {}; } })();
      // 每次工具调用都必须带 summary —— 这里就是它的去处
      steps.append(el("step", `⚙ ${args.summary || data.item?.name || "工具"}`));
    } else if (event === "reasoning") {
      steps.append(el("step think", "…思考"));
    } else if (event === "message") {
      // 逐字增量与整条 item 都走 message:有 delta 就追加,有 item 就以它为准
      if (typeof data.delta === "string") final += data.delta;
      else if (data.item) final = (data.item.content || []).map((p) => p.text || "").join("");
      answer.textContent = final;
      if (!answer.parentNode) stream.append(answer);
    } else if (event === "done") {
      if (data.text) { final = data.text; answer.textContent = final; }
      label.textContent = `已工作 ${Math.round((Date.now() - started) / 1000)} 秒`;
      work.classList.add("folded");
    } else if (event === "error") {
      answer.className = "turn error";
      answer.textContent = "出错:" + data.error;
      if (!answer.parentNode) stream.append(answer);
      label.textContent = "失败";
    }
    bottom();
  };

  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const chunks = buf.split("\n\n");
    buf = chunks.pop() || "";
    for (const chunk of chunks) {
      const ev = /^event: (.+)$/m.exec(chunk)?.[1];
      const raw = /^data: (.+)$/m.exec(chunk)?.[1];
      if (!ev || !raw) continue;
      try { handle(ev, JSON.parse(raw)); } catch { /* 坏帧跳过 */ }
    }
  }

  if (final) await fetch("/api/record", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ text: final }),
  });
}

$("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  $("send").disabled = true;
  try { await send(text); } finally { $("send").disabled = false; $("input").focus(); }
});

$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("composer").requestSubmit();
});

$("clear").addEventListener("click", async () => {
  if (!(await window.wandesk.ui.confirm("清空全部对话?")).ok) return;
  await fetch("/api/clear", { method: "POST" });
  history();
});

// 工作过程默认折叠,点开看细节
stream.addEventListener("click", (e) => {
  const w = e.target.closest(".work");
  if (w) w.classList.toggle("open");
});

history();
</script>
